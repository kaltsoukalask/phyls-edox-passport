* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--dark); color: var(--white); }
body {
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px;
  transition: opacity 0.6s ease;
}
.hidden { display: none !important; }
.fade { opacity: 0; pointer-events: none; }

/* LOCK */
.lock-screen { z-index: 99999; background: var(--dark); }
.lock-logo {
  width: 130px; aspect-ratio: 4 / 3;
  background-image: var(--phyls-logo); background-repeat: no-repeat;
  background-position: center; background-size: contain; margin-bottom: 3rem;
}
.lock-field { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
.lock-input {
  background: transparent; border: none; border-bottom: 0.5px solid rgba(255,255,255,0.18);
  outline: none; font-family: "Cormorant Garamond", serif; font-size: 1.4rem;
  letter-spacing: 0.35em; color: var(--white); text-align: center; width: 16rem;
  padding-bottom: 0.4rem; caret-color: var(--gold); border-radius: 0;
}
.lock-input::placeholder { color: rgba(255,255,255,0.12); letter-spacing: 0.22em; }
.lock-label { font-size: 0.48rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.18); }
.lock-error {
  font-size: 0.48rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(184,148,90,0.55); margin-top: 1.25rem; opacity: 0; transition: opacity 0.25s;
}
.lock-error.show { opacity: 1; }
@keyframes lock-shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.lock-input.shake { animation: lock-shake 0.35s ease; }

/* COUNTDOWN */
.cd-logo { width: 70px; aspect-ratio: 4 / 3; background-image: var(--phyls-logo); background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.55; margin-bottom: 3.5rem; }
.cd-title {
  font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 300;
  font-size: clamp(1.6rem, 7vw, 2.4rem); text-align: center; line-height: 1.2; margin-bottom: 2.5rem;
}
.cd-clock { display: flex; align-items: flex-start; gap: clamp(0.4rem, 3vw, 1.2rem); }
.cd-unit { display: flex; flex-direction: column; align-items: center; }
.cd-num {
  font-family: "Cormorant Garamond", serif; font-weight: 300;
  font-size: clamp(3.2rem, 17vw, 6.5rem); line-height: 1; color: var(--gold);
  font-variant-numeric: tabular-nums; min-width: 1.15em; text-align: center;
}
.cd-sep { font-family: "Cormorant Garamond", serif; font-weight: 300; font-size: clamp(2.6rem, 13vw, 5rem); line-height: 1.1; color: rgba(184,148,90,0.35); }
.cd-lab { margin-top: 0.8rem; font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
.cd-foot {
  margin-top: 3.5rem; font-family: "Cormorant Garamond", serif; font-size: clamp(1.05rem, 4.5vw, 1.35rem);
  color: rgba(255,255,255,0.6); text-align: center;
}

/* ENVELOPE */
.env-wrap { width: min(92vw, 520px); perspective: 1400px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.env {
  position: relative; width: 100%; aspect-ratio: 1.55;
  background: linear-gradient(160deg, var(--cream) 0%, var(--cream-deep) 100%);
  border-radius: 4px; box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.4) inset;
  color: var(--navy); transform-style: preserve-3d;
  transition: transform 0.8s ease, opacity 0.8s ease;
}
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 56%;
  background: linear-gradient(180deg, #ece3d3 0%, #ddd1bd 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center; transition: transform 0.9s cubic-bezier(0.5,0,0.2,1);
  z-index: 3; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.12));
}
.env-seal {
  position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%);
  width: 15%; aspect-ratio: 1; border-radius: 50%; z-index: 4;
  background: radial-gradient(circle at 35% 30%, #3a3fa0 0%, var(--navy) 55%, #10123f 100%);
  box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
  color: rgba(243,236,223,0.85); font-size: clamp(0.9rem, 4.2vw, 1.5rem);
  transition: opacity 0.4s ease;
}
.env-from {
  position: absolute; left: 6%; bottom: 8%; z-index: 2;
  font-size: clamp(0.42rem, 1.9vw, 0.62rem); letter-spacing: 0.14em; line-height: 1.7; text-transform: uppercase;
}
.env-to {
  position: absolute; right: 7%; bottom: 8%; z-index: 2; text-align: left;
  font-size: clamp(0.5rem, 2.4vw, 0.8rem); letter-spacing: 0.16em; line-height: 1.7; text-transform: uppercase;
}
.env-k { display: block; font-family: "Cormorant Garamond", serif; font-style: italic; text-transform: none; letter-spacing: 0.02em; font-size: 1.5em; color: rgba(28,31,107,0.6); margin-bottom: 0.1em; }
.env-name { font-weight: 500; }
.env-stamp {
  position: absolute; right: 5%; top: 7%; z-index: 2; width: 13%; aspect-ratio: 0.82;
  border: 1.5px dashed rgba(28,31,107,0.45); display: flex; align-items: center; justify-content: center;
  font-family: "Cormorant Garamond", serif; font-size: clamp(1rem, 5vw, 1.7rem); color: var(--gold);
}
.env-hint { margin-top: 2.2rem; text-align: center; font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.4); animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.9; } }
.env-wrap.open .env-flap { transform: rotateX(180deg); }
.env-wrap.open .env-seal { opacity: 0; }
.env-wrap.gone .env { transform: translateY(40px) scale(0.92); opacity: 0; }

/* LETTER */
.letter-screen { position: static; min-height: 100%; justify-content: flex-start; padding: 28px 16px 48px; opacity: 0; transition: opacity 1s ease; }
.letter-screen.show { opacity: 1; }
.letter-img {
  display: block; width: min(100%, 640px); height: auto; border-radius: 3px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  transform: translateY(30px); transition: transform 1.1s cubic-bezier(0.2,0.7,0.2,1);
  -webkit-touch-callout: default;
}
.letter-screen.show .letter-img { transform: translateY(0); }
.save-btn {
  margin-top: 2rem; background: transparent; color: var(--gold); border: 0.5px solid rgba(184,148,90,0.6);
  font-family: "DM Sans", sans-serif; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase;
  padding: 1rem 1.8rem; border-radius: 2px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.save-btn:active { background: rgba(184,148,90,0.12); }
.save-note { margin-top: 1rem; max-width: 22rem; text-align: center; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1rem; color: rgba(255,255,255,0.45); line-height: 1.4; }
</style>

  <button class="save-btn" id="save-btn">Save the letter</button>
  <p class="save-note">Keep it. This page will disappear in a few days.</p>

<script>
(function () {
  var CODE = '150826';
  // Midnight 4 Nov 2026, Greece time (EET, UTC+2) = 22:00 UTC 3 Nov
  var TARGET = Date.UTC(2026, 10, 3, 21, 55, 0);
  var params = new URLSearchParams(window.location.search);
  var preview = params.get('preview') === '1';

  var lock = document.getElementById('lock-screen');
  var input = document.getElementById('lock-input');
  var error = document.getElementById('lock-error');
  var cd = document.getElementById('countdown');
  var env = document.getElementById('envelope');
  var envWrap = document.getElementById('env-wrap');
  var letter = document.getElementById('letter');
  var timer = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isTime() { return preview || Date.now() >= TARGET; }

  function showEnvelope() {
    if (timer) { clearInterval(timer); timer = null; }
    cd.classList.add('fade');
    setTimeout(function () { cd.classList.add('hidden'); env.classList.remove('hidden'); }, cd.classList.contains('hidden') ? 0 : 600);
  }

  function tick() {
    var left = TARGET - Date.now();
    if (left <= 0) { showEnvelope(); return; }
    var s = Math.floor(left / 1000);
    document.getElementById('cd-h').textContent = pad(Math.floor(s / 3600));
    document.getElementById('cd-m').textContent = pad(Math.floor((s % 3600) / 60));
    document.getElementById('cd-s').textContent = pad(s % 60);
  }

  function enter() {
    if (isTime()) { env.classList.remove('hidden'); }
    else { cd.classList.remove('hidden'); tick(); timer = setInterval(tick, 250); }
  }

  setTimeout(function () { input.focus(); }, 300);
  input.addEventListener('input', function () {
    error.classList.remove('show');
    if (this.value.length >= CODE.length) {
      if (this.value === CODE) {
        input.blur();
        enter();
        lock.classList.add('fade');
        setTimeout(function () { lock.classList.add('hidden'); }, 620);
      } else {
        input.classList.add('shake');
        error.classList.add('show');
        setTimeout(function () { input.classList.remove('shake'); input.value = ''; }, 380);
      }
    }
  });

  var opened = false;
  envWrap.addEventListener('click', function () {
    if (opened) return;
    opened = true;
    document.querySelector('.env-hint').style.visibility = 'hidden';
    envWrap.classList.add('open');
    setTimeout(function () { envWrap.classList.add('gone'); }, 1000);
    setTimeout(function () {
      env.classList.add('hidden');
      letter.classList.remove('hidden');
      document.body.style.overflowY = 'auto';
      requestAnimationFrame(function () { requestAnimationFrame(function () { letter.classList.add('show'); }); });
    }, 1700);
  });

  document.getElementById('save-btn').addEventListener('click', function () {
    var src = document.getElementById('letter-img').src;
    var name = 'For Marianna, 4 Nov 2026.jpg';
    fetch(src).then(function (r) { return r.blob(); }).then(function (blob) {
      var file = new File([blob], name, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file] }).catch(function () {});
      }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    });
  });
})();
</script>
